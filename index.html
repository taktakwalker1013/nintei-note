<title>認定調査ノート</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: phone-first single column; sticky header, list → full-screen item sheet, fixed bottom tab bar */
:root{
  --bg:#f3f5f7; --card:#ffffff; --fg:#1e2731; --sub:#5d6875; --line:#d9dee4;
  --nav:#1f4a73; --nav-soft:#e6eef6;
  --ab:#2563a8; --ab-soft:#e6eef9; --kai:#2a7a4c; --kai-soft:#e4f3ea; --umu:#bf5d17; --umu-soft:#fcefe3;
  --med:#7a4bb0; --med-soft:#f0e9f8;
  --ok:#2a7a4c; --warn:#a86400; --warn-soft:#fff4dd; --bad:#b83a2e; --bad-soft:#fbe9e7;
  --font:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --card:#1b222a; --fg:#e6ebf0; --sub:#9aa6b2; --line:#2e3843;
  --nav:#8db8e3; --nav-soft:#1f2c3a;
  --ab:#7fb0ee; --ab-soft:#1d2a3b; --kai:#71c793; --kai-soft:#1a2d22; --umu:#f0a066; --umu-soft:#33241a;
  --med:#c3a1ec; --med-soft:#2a2236;
  --ok:#71c793; --warn:#f0bd5e; --warn-soft:#332a17; --bad:#f08a7e; --bad-soft:#3a1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --card:#1b222a; --fg:#e6ebf0; --sub:#9aa6b2; --line:#2e3843;
  --nav:#8db8e3; --nav-soft:#1f2c3a;
  --ab:#7fb0ee; --ab-soft:#1d2a3b; --kai:#71c793; --kai-soft:#1a2d22; --umu:#f0a066; --umu-soft:#33241a;
  --med:#c3a1ec; --med-soft:#2a2236;
  --ok:#71c793; --warn:#f0bd5e; --warn-soft:#332a17; --bad:#f08a7e; --bad-soft:#3a1f1c; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--nav);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:8px;max-width:720px;margin:0 auto}
.top h1{font-size:17px;margin:0;flex:0 0 auto;color:var(--nav);letter-spacing:.02em}
.top select{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.prog{max-width:720px;margin:6px auto 0;height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--nav);width:0}
.progtxt{max-width:720px;margin:2px auto 0;font-size:12px;color:var(--sub)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{border:0;background:none;padding:10px 4px 12px;font-size:13px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button b{font-size:15px}
nav.tabs button[aria-selected="true"]{color:var(--nav);font-weight:700;box-shadow:inset 0 3px 0 var(--nav)}
.badge{position:relative}
.badge[data-n]:not([data-n="0"])::after{content:attr(data-n);position:absolute;top:4px;right:22%;background:var(--bad);color:#fff;font-size:11px;border-radius:9px;padding:0 6px;line-height:18px}
h2{font-size:18px;margin:18px 0 8px;text-wrap:balance}
h3{font-size:15px;margin:14px 0 6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--nav);border-color:var(--nav);color:var(--card)}
.list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.item{display:grid;grid-template-columns:3.4em 1fr auto;gap:4px 10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.item .code{font-variant-numeric:tabular-nums;font-weight:700;color:var(--sub);font-size:14px}
.item .nm{font-weight:700;min-width:0}
.item .val{grid-column:2/4;font-size:14px;color:var(--sub);min-width:0}
.item .val b{color:var(--fg)}
.item.done{border-left:5px solid var(--ok)}
.item.need{border-left:5px solid var(--warn);background:var(--warn-soft)}
.item.err{border-left:5px solid var(--bad);background:var(--bad-soft)}
.dot.r{background:var(--bad-soft);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--sub);margin-top:4px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--line)}
.legend .l1::before{background:var(--ok)} .legend .l2::before{background:var(--warn)} .legend .l3::before{background:var(--bad)}
.chips button .cnt{display:inline-block;margin-left:4px;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;line-height:17px}
.tpls{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tpls button{border:1px dashed var(--nav);background:var(--card);color:var(--nav);border-radius:16px;padding:5px 10px;font-size:13px;text-align:left;max-width:100%}
.tplrow{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.tplrow:last-child{border-bottom:0}
.tplrow .tx{flex:1;min-width:0;font-size:14px}
.tplrow .sc{font-size:12px;color:var(--sub)}
.tplrow button{flex:0 0 auto;border:1px solid var(--bad);color:var(--bad);background:var(--card);border-radius:8px;padding:3px 8px;font-size:13px}
.item .flags{display:flex;gap:4px}
.ax{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;white-space:nowrap}
.ax.A{background:var(--ab-soft);color:var(--ab)} .ax.K{background:var(--kai-soft);color:var(--kai)} .ax.U{background:var(--umu-soft);color:var(--umu)} .ax.M,.ax.J{background:var(--med-soft);color:var(--med)}
.dot{font-size:11px;border-radius:5px;padding:0 5px;background:var(--nav-soft);color:var(--nav);font-weight:700}
.dot.w{background:var(--warn-soft);color:var(--warn)}
/* item sheet */
.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.sheet .bar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.sheet .bar button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px}
.sheet .bar .t{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .in{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:12px 120px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--sub)}
.def{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.choices button{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:16px;display:flex;gap:10px;align-items:flex-start}
.choices button .no{font-variant-numeric:tabular-nums;font-weight:700;color:var(--sub);min-width:1.4em}
.choices button[aria-pressed="true"]{border-color:var(--nav);background:var(--nav-soft);font-weight:700}
.choices button[aria-pressed="true"] .no{color:var(--nav)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:10px}
details>summary{padding:11px 12px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"＋";color:var(--sub)}
details[open]>summary::after{content:"－"}
details .bd{padding:0 12px 12px}
ul.tips{margin:0;padding-left:1.2em}
ul.tips li{margin:4px 0}
label.f{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input[type=text],input[type=number],input[type=date],select.s,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:9px 10px;font-size:16px}
textarea{min-height:5.5em;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{border:1px solid var(--nav);background:var(--nav);color:var(--card);border-radius:10px;padding:9px 14px;font-weight:700}
.btn.o{background:var(--card);color:var(--nav)}
.btn.d{background:var(--card);color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.res{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--nav-soft);font-size:15px}
.note{font-size:13px;color:var(--sub)}
.warnbox{background:var(--warn-soft);color:var(--fg);border-left:4px solid var(--warn);padding:8px 12px;border-radius:8px;font-size:14px;margin-top:8px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk input{width:22px;height:22px;flex:0 0 auto;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.issue{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:10px;padding:10px 12px;margin-top:6px;width:100%;text-align:left}
.issue.bad{border-left-color:var(--bad)} .issue.info{border-left-color:var(--nav)}
.issue .k{font-size:12px;font-weight:700;white-space:nowrap}
.issue.bad .k{color:var(--bad)} .issue .k{color:var(--warn)} .issue.info .k{color:var(--nav)}
pre.out{white-space:pre-wrap;word-break:break-all;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;font-family:var(--font);max-height:60vh;overflow:auto}
.sample{background:var(--warn-soft);border:1px dashed var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:10px}
.pin{background:var(--bad-soft);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--card);width:100%;max-width:720px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;z-index:30}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}}}
</style></head><body>

<header class="top">
  <div class="row">
    <h1>認定調査ノート</h1>
    <select id="caseSel" aria-label="調査を選ぶ"></select>
  </div>
  <div class="prog"><i id="progBar"></i></div>
  <div class="progtxt" id="progTxt"></div>
</header>

<main class="wrap" id="main"></main>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="items" aria-selected="true"><b>☰</b>項目</button>
  <button role="tab" data-tab="check" class="badge" id="tabCheck"><b>✓</b>チェック</button>
  <button role="tab" data-tab="out"><b>⎘</b>まとめ</button>
  <button role="tab" data-tab="prep"><b>⚙</b>準備・管理</button>
</nav>

<script>
"use strict";
/* ===== 調査項目マスタ（根拠：認定調査員テキスト2009 令和6年4月改訂版） ===== */
const CH = {
  A3:["つかまらないでできる","何かにつかまればできる","できない"],
  S3:["支えなしでできる","何か支えがあればできる","できない"],
  ZA:["できる","自分の手で支えればできる","支えてもらえればできる","できない"],
  K4:["介助されていない","見守り等","一部介助","全介助"],
  K3:["介助されていない","一部介助","全介助"],
  SN:["介助されていない","一部介助","全介助","行っていない"],
  SI:["普通（日常生活に支障がない）","約1m離れた視力確認表の図が見える","目の前に置いた視力確認表の図が見える","ほとんど見えない","見えているのか判断不能"],
  CH:["普通","普通の声がやっと聞き取れる","かなり大きな声なら何とか聞き取れる","ほとんど聞こえない","聞こえているのか判断不能"],
  EN:["できる","見守り等","できない"],
  GA:["週1回以上","月1回以上","月1回未満"],
  IS:["調査対象者が意思を他者に伝達できる","ときどき伝達できる","ほとんど伝達できない","できない"],
  YN:["できる","できない"],
  BP:["ない","ときどきある","ある"],
  KE:["できる（特別な場合でもできる）","特別な場合を除いてできる","日常的に困難","できない"],
  SH:["自立","J1","J2","A1","A2","B1","B2","C1","C2"],
  NI:["自立","Ⅰ","Ⅱa","Ⅱb","Ⅲa","Ⅲb","Ⅳ","M"]
};
/* [コード, 名称, 軸, 選択肢キー, 期間, 定義, つまずき[], 種別] 種別: multi=部位の複数選択 bpsd=頻度判定 */
const ITEMS = [
 ["1-1","麻痺等の有無","U","MAHI","過去1週間","筋肉の随意的な運動機能の低下・消失。上肢＝座位で肘を伸ばし腕を前方と横に肩の高さまで挙げて静止できるか（円背はあごの高さ）。下肢＝座位で膝を伸ばし下腿を水平に挙げて静止できるか。〔P31〜35〕",["前方か横のどちらか一方でもできなければ「あり」","冷感・しびれ等の感覚障害だけでは含まない","筋力低下・意識障害・パーキンソン病等で動作できなければ含む","欠損や上下肢以外の麻痺は「その他」を選び、部位を必ず特記","軽い可動域制限は動く範囲で確認動作を行う","同意を得てゆっくり。痛みを訴えたら中止","主治医意見書とは基準が違う"],"multi"],
 ["1-2","拘縮の有無","U","KOU","過去1週間","他動的に動かしたとき関節の動く範囲が著しく狭い。肩＝前方または横に肩の高さまで／股＝屈曲90度程度または外転25cm程度（拳2個分）／膝＝90度程度曲がるか。〔P36〜40〕",["自分で動かせないが他動なら動く→拘縮ではない（ない）","左右どちらかに制限があれば「あり」","疼痛による制限も含む","定義の範囲外の支障は「ない」を選び特記","腰椎・頚椎等は「その他」で部位を特記","本人か家族の同意を得て、4〜5秒かけてゆっくり"],"multi"],
 ["1-3","寝返り","A","A3","過去1週間","横たわったまま左右どちらかに向きを変え、安定した状態になる。片側だけ・不完全な横向きでよい。ふとんはかけない。〔P41〕",["膝の裏・寝巻きなど自分の体をつかむ→2","声かけで自力でできれば1","上半身だけでも向きが変われば1","起き上がってから向きを変えるのは寝返りではない","ベッド柵に紐をつけてつかまる→2"]],
 ["1-4","起き上がり","A","A3","過去1週間","ふとんをかけずに寝た状態から上半身を起こす。経路は問わない（うつ伏せ経由も可）。〔P43〕",["習慣的に手や肘をつくだけ（支えにしていない）→1","支えにして加重・自分の体をつかむ→2","途中まででも最後に介助が要れば3","ギャッチアップ機能は使わない状態で評価（常時ギャッチアップならその状態から・特記）","家族が介助していても能力で選ぶ"]],
 ["1-5","座位保持","A","ZA","過去1週間","背もたれなしで10分間程度座位を保つ。座り方（長座位・端座位）は問わない。〔P45〕",["背もたれ・クッションに寄りかかれば保てる→3（4ではない）","車いすの背を支えにしていなければ1","普段ソファーにもたれているかは関係ない（背もたれなしで座れる能力）","4＝背もたれがあっても保てない（長期の水平体位・医学的理由・体幹屈曲不可）","畳の生活なら待合室・トイレ等の状況で"]],
 ["1-6","両足での立位保持","A","S3","過去1週間","立ち上がった後、平らな床で10秒間程度立位を保つ。立ち上がるまでは含まない。〔P48〕",["介護者が支えれば立てる→3","膝に手を置く・肘掛けに加重→2","片足しかつかない人は片足での状況で","調査時できても日頃できないことが多い→より頻回な状況で"]],
 ["1-7","歩行","A","A3","過去1週間","立った状態から、立ち止まらず座り込まずに5m程度歩く。歩幅・速度・目的は問わない。〔P50〕",["2〜3mしか歩けない・途中で座り込む→3","杖・歩行器・壁・自分の膝に手を置く→2","迷うので手を引く（体は支えていない）→1","方向確認だけの杖→1","医療上の歩行制限・リハビリの平行棒だけ→3","両足切断で手で移動→3","出迎え等で確認できれば試行不要（聞き取りは必要）"]],
 ["1-8","立ち上がり","A","A3","過去1週間","いす・ベッド・車いす等に膝がほぼ直角の状態で座り、立ち上がる。床からは含まない。〔P53〕",["膝に手をつく・座面を押して加重→2","支えがあれば自分で立てる→2、介護者が引き上げる→3","畳の生活ならトイレ・待合室の状況で"]],
 ["1-9","片足での立位","A","S3","過去1週間","平らな床で、自分で左右どちらかの片足を上げたまま1秒間程度立位を保つ。〔P55〕",["立ち上がるまでの介助は問わない","介護者に支えられないと上げられない→3"]],

function valText(it, r){
  if(r.v==null || (Array.isArray(r.v)&&r.v.length===0 && !(it.kind==="med"&&r.medDone))) return "";
  const cs = choicesOf(it);
  if(it.kind==="med") return r.v.length? r.v.map(i=>cs[i]).join("、") : "該当なし";
  if(isMulti(it)) return r.v.map(i=>`${i+1}.${cs[i]}`).join("、");
  return `${r.v}.${cs[r.v-1]}`;
}
function done(it, r){ if(it.kind==="med") return !!r.medDone || (Array.isArray(r.v)&&r.v.length>0); return r.v!=null && !(Array.isArray(r.v)&&r.v.length===0); }

function bpsdChoice(n, per){ // 回数→選択（BPSD関連〔P114〕）
  const perWeek = per==="週" ? n : per==="月" ? n/4.3 : n*7;
  const perMonth = per==="月" ? n : per==="週" ? n*4.3 : n*30;
  if(perWeek>=1) return 3; if(perMonth>=1) return 2; return 1;
}

  ALL.forEach(it=>{
    const R=r[it.c]||{}; const t=R.tok||"";

    if(R.trial==="diff" && !t) add("warn",it.c,"試行と日頃の状況が違う項目です。両方の状況と選択根拠を特記に〔P21〕。");
    const vg = vagueIn(t); if(vg.length) add("warn",it.c,`特記に「${vg.join("・")}」があります。頻度は「週2回」のように数で書きます〔P19〕。`);
    if(it.ax==="K" && R.v===2 && /全介助|全面的|すべて介助/.test(t)) add("bad",it.c,"選択は「見守り等」なのに特記に「全介助」等の記載。選択と特記が食い違っています〔P8〕。");
    if(it.ax==="K" && R.v===1 && /一部介助|全介助|介助している|介助が必要/.test(t) && !R.inapp) add("warn",it.c,"選択は「介助されていない」ですが、特記に介助の記載があります。一連の行為の範囲外の介助か確認を。");
  });
  // 特別な医療の3点
  const m=r["M"]; if(m && Array.isArray(m.v)) m.v.forEach(i=>{ const d=(m.det||{})[i]||{}; if(!d.f||!d.who||!d.why) add("warn","M",`特別な医療「${MED[i]}」：実施頻度／継続性・実施者・必要とする理由の3点を記入してください〔P147〕。`); if(d.who && /家族|ヘルパー|介護職|本人/.test(d.who)) add("bad","M",`特別な医療「${MED[i]}」の実施者が「${d.who}」。医師・看護師等の行為でなければ該当しません（研修修了介護職の喀痰吸引・経管栄養は例外）。`); });
  return out;
}

function itemStates(){
  const st={}; issues().forEach(x=>{ if(!x.code) return; if(x.lv==="bad") st[x.code]="err"; else if(x.lv==="warn" && st[x.code]!=="err") st[x.code]="need"; }); return st;
}

  h+=`<h3>調査の終わりに</h3><div class="card">
    <div class="chk"><input type="checkbox" id="end1" ${c.end1?"checked":""} data-end="end1"><label for="end1">不明な点・迷う点を本人・介護者に再確認した〔P8〕</label></div>
    <div class="chk"><input type="checkbox" id="end2" ${c.end2?"checked":""} data-end="end2"><label for="end2">基本調査と特記事項に矛盾がないか確認した〔P8〕</label></div>
    <div class="chk"><input type="checkbox" id="end3" ${c.end3?"checked":""} data-end="end3"><label for="end3">より頻回な状況で選んだ・介助者不在・特殊な状況で迷った項目を事務局に伝える〔P9〕</label></div></div>`;
  return h;
}

function summaryText(c){
  const L=[]; L.push(`調査番号：${c.id}　調査日：${c.date||""}`); L.push("");
  const gk=c.gk||{}; if(GK_FIELDS.some(f=>gk[f[0]])){ L.push("■概況調査"); GK_FIELDS.forEach(([k,l])=>{ if(gk[k]) L.push(`${l}：${gk[k]}`); }); L.push(""); }
  GROUPS.forEach(([g,l])=>{
    L.push(`■${l}`);
    ALL.filter(x=>x.g===g).forEach(it=>{ const r=c.r[it.c]||{}; L.push(`${it.c.startsWith("J")||it.c==="M"?"":it.c+" "}${it.n}：${valText(it,r)||"（未選択）"}`); });
    if(g==="M"){ const m=c.r["M"]; if(m&&m.v) m.v.forEach(i=>{const d=(m.det||{})[i]||{}; L.push(`　・${MED[i]}：実施頻度／継続性＝${d.f||"（未記入）"}、実施者＝${d.who||"（未記入）"}、理由＝${d.why||"（未記入）"}`);}); }
    L.push("");
  });
  L.push("■特記事項");
  GROUPS.forEach(([g,l])=>{ const ts=ALL.filter(x=>x.g===g).map(it=>(c.r[it.c]||{}).tok).filter(Boolean); if(ts.length){ L.push(`［${l}］`); ts.forEach(t=>L.push(t)); } });
  return L.join("\n");
}
function renderOut(){
  const c=cur(); if(!c) return `<p>調査がありません。</p>`;
  const txt=summaryText(c);
  const memos = ALL.map(it=>[it,(c.r[it.c]||{}).memo]).filter(x=>x[1]).map(([it,m])=>`（${it.c.startsWith("J")||it.c==="M"?it.n:it.c}）${m}`).join("\n");
  return `<h2>転記用まとめ</h2><p class="note">市町村の調査票に転記するための一覧です。氏名は入れていません。</p>
    <div class="row"><button class="btn" data-act="copysum">まとめをコピー</button></div>
    <pre class="out" id="sumOut" tabindex="0">${esc(txt)}</pre>
    <h2>聞き取りメモ一覧</h2><p class="note">特記事項を整えるときの見直し用です（転記用まとめには入りません）。</p>
    ${memos?`<div class="row"><button class="btn o" data-act="copymemo">メモをコピー</button></div><pre class="out" id="memoOut" tabindex="0">${esc(memos)}</pre>`:`<div class="card note">メモはまだありません。各項目の「聞き取りメモ」に書くと、ここに集まります。</div>`}`;
}

function renderPrep(){
  const c=cur();
  const pre=(c&&c.pre)||{};
  const P=[["p1","日時：本人・介護者と調整し、介護者がいない日を避けた〔P7〕"],["p2","本人が通常の状態か確認した（急病・高熱なら日を改める）〔P6〕"],["p3","場所：日頃の状況が分かる場所。施設・病院は普段過ごす場所で、プライバシーに配慮〔P7〕"],["p4","持ち物：身分を証する物（調査員証等）〔P7〕"],["p5","持ち物：視力確認表。短期記憶の3品テスト用にペンと時計〔P7・P105〕"],["p6","立ち会い：日頃の状況を知る家族・職員に依頼した（特別な医療は家族等の同席が望ましい）〔P7・P147〕"],["p7","調査の目的を説明する。専門用語を使わず、項目の順番にこだわらない〔P7〕"]];
  let h=`<h2>調査前チェック</h2>${c?`<div class="card">${P.map(([k,l])=>`<div class="chk"><input type="checkbox" id="${k}" data-pre="${k}" ${pre[k]?"checked":""}><label for="${k}">${l}</label></div>`).join("")}</div>`:""}
  <h2>調査の管理</h2>
  <div class="pin">氏名・住所・電話番号は入れないでください。調査は番号（例：A-001）で管理します。データはこの端末のブラウザの中だけに保存され、外部には送信されません。</div>
  <div class="card"><label class="f" for="newId">新しい調査の番号</label><input type="text" id="newId" placeholder="例：A-001" autocomplete="off">
    <label class="f" for="newDate">調査日</label><input type="date" id="newDate" value="${new Date().toISOString().slice(0,10)}">
    <div class="row" style="margin-top:10px"><button class="btn" data-act="newcase">作成する</button></div></div>
  ${c?`<div class="card"><b>選択中：${esc(c.id)}</b><label class="f" for="curDate">調査日</label><input type="date" id="curDate" value="${esc(c.date||"")}">
    <div class="row" style="margin-top:10px"><button class="btn d" data-act="delcase">この調査を削除</button></div></div>`:""}
  <h2>定型文</h2>
  <p class="note">特記事項に差し込める文です。項目の画面からも登録できます。「BPSD」は第4群などの行動の項目すべてに出ます。</p>
  <div class="card">
    ${(DB.tpl||[]).map(t=>`<div class="tplrow"><div class="tx"><div class="sc">${t.code===""?"全項目共通":t.code==="BPSD"?"BPSD関連の項目":t.code==="M"?"特別な医療":t.code==="J1"||t.code==="J2"?"自立度":t.code}</div>${esc(t.text)}</div><button data-tpldel="${esc(t.id)}">削除</button></div>`).join("") || `<p class="note">定型文はありません。</p>`}
    <label class="f" for="tplNewP">新しい定型文</label><textarea id="tplNewP" style="min-height:4em"></textarea>
    <label class="f" for="tplCodeP">使う項目</label><select class="s" id="tplCodeP"><option value="">全項目共通</option><option value="BPSD">BPSD関連の項目</option>${ALL.map(it=>`<option value="${it.c}">${it.c.startsWith("J")||it.c==="M"?"":it.c+" "}${esc(it.n)}</option>`).join("")}</select>
    <div class="row" style="margin-top:8px"><button class="btn" data-act="tplAddP">登録する</button><button class="btn o" data-act="tplReset">最初の定型文に戻す</button></div>
  </div>
  <h2>バックアップ</h2>
  <p class="note">ブラウザのデータ消去や機種変更で消えることがあります。下の文字をコピーして安全な場所に保存し、戻すときは貼り付けて「読み込む」を押します。ファイルからも読み込めます。</p>
  <div class="row"><button class="btn o" data-act="copyjson">バックアップをコピー</button></div>
  <label class="f" for="jsonBox">バックアップの文字（貼り付けて読み込み）</label><textarea id="jsonBox" style="min-height:6em"></textarea>
  <div class="row" style="margin-top:8px"><button class="btn o" data-act="importjson">貼り付けた内容を読み込む</button><label class="btn o" for="jsonFile" style="display:inline-block">ファイルから読み込む</label><input type="file" id="jsonFile" accept=".json,.txt,application/json,text/plain" hidden></div>
  <h2>このアプリについて</h2><p class="note">根拠は「認定調査員テキスト2009（令和6年4月改訂版）」。〔P○〕はテキストのページ。判断の補助と記録のための道具です。最終的な選択は各項目の定義に基づき調査員が行い、一次判定の確定は介護認定審査会が行います。</p>`;
  return h;
}

function render(){
  renderHeader();
  const m=$("#main");
  m.innerHTML = TAB==="items"?renderItems():TAB==="check"?renderCheck():TAB==="out"?renderOut():renderPrep();
  renderSheet();
}

/* ===== 操作 ===== */
function confirmBox(msg, ok, label){
  const d=document.createElement("div"); d.className="modal";
  d.innerHTML=`<div class="box"><p style="margin-top:0">${esc(msg)}</p><div class="row"><button class="btn d" data-y>${esc(label||"削除する")}</button><button class="btn o" data-n>やめる</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector("[data-y]").onclick=()=>{d.remove();ok();}; d.querySelector("[data-n]").onclick=()=>d.remove();
}
function setV(code, v){ rec(code).v=v; save(); }

function bindSheet(s, it){
  const r=rec(it.c);
  s.addEventListener("click", e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.ch!=null){
      const i=+b.dataset.ch;
      if(isMulti(it)){ let v=r.v||[]; if(i===0) v=[0]; else { v=v.filter(x=>x!==0); v=v.includes(i)?v.filter(x=>x!==i):v.concat(i).sort((a,b)=>a-b); } r.v=v; }
      else r.v=i+1;
      save(); renderHeader(); refreshSheet(); return;
    }
    if(b.dataset.med!=null){ const i=+b.dataset.med; let v=r.v||[]; v=v.includes(i)?v.filter(x=>x!==i):v.concat(i).sort((a,b)=>a-b); r.v=v; r.medDone=true; save(); renderHeader(); refreshSheet(); return; }
    if(b.dataset.tpl){
      const tp=(DB.tpl||[]).find(x=>x.id===b.dataset.tpl); if(!tp) return;
      const ta=s.querySelector("#tok"); const v=ta.value; const p=(typeof ta.selectionStart==="number")?ta.selectionStart:v.length;
      ta.value=v.slice(0,p)+tp.text+v.slice(p); readTok(s,r); save(); renderHeader(); refreshSheet();
      const n=$(".sheet #tok"); if(n){ n.focus(); const q=p+tp.text.length; try{ n.setSelectionRange(q,q); }catch(e){} }
      return;
    }
    if(b.dataset.act==="tplFromTok"){ const ta=s.querySelector("#tok"); const nb=s.querySelector("#tplNew"); nb.value=ta.value; nb.focus(); return; }
    if(b.dataset.act==="tplAddItem" || b.dataset.act==="tplAddAll"){
      const txt=s.querySelector("#tplNew").value.trim(); if(!txt){ toast("登録する文を入れてください"); return; }
      DB.tpl=DB.tpl||[]; DB.tpl.push({id:"u"+Date.now(), code:b.dataset.act==="tplAddAll"?"":it.c, text:txt});
      readTok(s,r); save(); refreshSheet(); toast("定型文を登録しました"); return;
    }
    if(b.dataset.trial){ r.trial = r.trial===b.dataset.trial?null:b.dataset.trial; if(r.trial==="diff" && !r.why) r.why="より頻回な状況から"; if(r.trial==="diff"||r.trial==="same"||r.trial==="no") {} save(); refreshSheet(); return; }
    const a=b.dataset.act;
    if(a==="close"){ OPEN=null; render(); return; }
    if(a==="prev"||a==="next"){ const i=ALL.findIndex(x=>x.c===it.c); const n=ALL[i+(a==="next"?1:-1)]; if(n){ OPEN=n.c; GF=n.g; render(); } return; }
    if(a==="freq"){
      const cs=choicesOf(it); const f={}; let tot=0;
      s.querySelectorAll("[data-fq]").forEach(x=>{ const n=parseInt(x.value,10); if(!isNaN(n)&&n>0){ f[x.dataset.fq]=n; tot+=n; } });
      r.freq=f; const ent=Object.entries(f).sort((a,b)=>b[1]-a[1]);
      const box=s.querySelector("#fqRes");
      if(!ent.length){ box.innerHTML=`<div class="warnbox">回数を入れてください。</div>`; return; }
      if(ent.length>1 && ent[0][1]===ent[1][1]){ box.innerHTML=`<div class="warnbox">回数が同じ選択肢があります（${ent.filter(e=>e[1]===ent[0][1]).map(e=>cs[e[0]]).join("・")}）。日頃の状況を聞き取り、迷った理由を特記して審査会の判断を仰いでください〔P8・P22〕。</div>`; save(); return; }
      const best=+ent[0][0]; r.v=best+1; r.freqUsed=ent.length>1; r.why= r.freqUsed?"より頻回な状況から":(r.why||"");
      if(r.freqUsed && !r.f) r.f = ent.map(e=>`${cs[e[0]]}${e[1]}回`).join("、")+`（計${tot}回）`;
      save(); renderHeader(); refreshSheet();
      s.querySelector("#fqRes").innerHTML=`<div class="res">「${best+1}.${esc(cs[best])}」を選びました（${ent[0][1]}/${tot}回）。${r.freqUsed?"頻回でない側の場面と頻度を特記に書き、事務局にも伝えます。":""}</div>`;
      return;
    }
    if(a==="bpsd"){
      const n=parseFloat(s.querySelector("#bpN").value); const p=s.querySelector("#bpP").value;
      const nat=s.querySelector("#bpA").checked, fit=s.querySelector("#bpB").checked;
      r.bp={n:isNaN(n)?null:n,p,nat,fit};
      const box=s.querySelector("#bpRes");
      if(nat && !fit){ r.v=1; save(); renderHeader(); refreshSheet(); s.querySelector("#bpRes").innerHTML=`<div class="res">性格・習慣による行動なので「1.ない」を選びました。手間があれば特記に書きます。</div>`; return; }
      if(isNaN(n)){ box.innerHTML=`<div class="warnbox">回数を入れてください（0回なら0）。</div>`; return; }
      const v=bpsdChoice(n,p); r.v=v; if(!r.f && n>0) r.f=`${p}${n}回程度`;
      save(); renderHeader(); refreshSheet();
      s.querySelector("#bpRes").innerHTML=`<div class="res">「${v}.${CH.BP[v-1]}」を選びました。${v>1?"対応の内容と頻度（対応していなければそのこと）を特記に書きます。":""}</div>`;
      return;
    }
    if(a==="gai"){ const n=parseInt(s.querySelector("#gaN").value,10); if(isNaN(n)){toast("回数を入れてください");return;} r.ga=n; r.v=gaiChoice(n); save(); renderHeader(); refreshSheet(); return; }
    if(a==="draft"){
      readTok(s,r); const cs=choicesOf(it);
      const sel = it.kind==="med" ? "" : isMulti(it) ? (r.v||[]).map(i=>`「${i+1}.${cs[i]}」`).join("") : (r.v?`「${r.v}.${cs[r.v-1]}」`:"「（未選択）」");
      let t=`（${it.c.startsWith("J")?it.n:it.c==="M"?"特別な医療":it.c}）`;
      if(r.s) t+=r.s.replace(/[。．]?$/,"。");
      if(r.f) t+=`頻度は${r.f}。`;
      if(sel) t+=`${r.why?r.why:""}${sel}を選択する。`;
      if(r.care) t+=r.care.replace(/[。．]?$/,"。");
      if(it.kind==="bpsd" && r.v>=2 && !r.care) t+="（対応していない場合は「特に対応はしていない」と書く）";
      r.tok=t; save(); refreshSheet(); toast("下書きを作りました。必要に応じて直してください"); return;
    }
    if(a==="copytok"){ readTok(s,r); save(); copy(r.tok||"", s.querySelector("#tok")); return; }
  });
  s.addEventListener("input", e=>{
    const x=e.target;
    if(x.id==="memo"){ r.memo=x.value; save(); return; }
    if(["tkS","tkC","tkF","tkR","tok"].includes(x.id)){ readTok(s,r); save(); renderHeader(); if(x.id==="tok"){ const w=s.querySelector(".warnbox.vg"); } return; }
    if(x.dataset.md!=null){ const i=x.dataset.md; r.det=r.det||{}; r.det[i]=r.det[i]||{}; r.det[i][x.dataset.k]=x.value; save(); renderHeader(); return; }
  });
  s.addEventListener("change", e=>{
    const x=e.target;
    if(x.dataset.ia!=null){ const ia=[]; s.querySelectorAll("[data-ia]").forEach(c=>{ if(c.checked) ia.push(+c.dataset.ia); }); r.ia=ia; r.inapp=ia.length>0; if(r.inapp) r.why="不適切な状況にあると判断し、適切な介助の方法として"; save(); renderHeader(); return; }
    if(x.id==="medNone"){ r.medDone=x.checked; if(x.checked) r.v=[]; save(); renderHeader(); refreshSheet(); return; }
    if(x.id==="tok"){ refreshSheet(); }
  });
}
function readTok(s,r){ const g=id=>{const e=s.querySelector("#"+id); return e?e.value:undefined;}; r.s=g("tkS")??r.s; r.care=g("tkC")??r.care; r.f=g("tkF")??r.f; r.why=g("tkR")??r.why; const t=g("tok"); if(t!==undefined) r.tok=t; }
function refreshSheet(){ const s=$(".sheet"); const y=s?s.scrollTop:0; const ae=document.activeElement&&document.activeElement.id; renderSheet(); const n=$(".sheet"); if(n){ n.scrollTop=y; if(ae){ const el=n.querySelector("#"+ae); if(el&&el.tagName!=="BUTTON") el.focus(); } } }

document.addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b || b.closest(".sheet") || b.closest(".modal")) return;
  if(b.dataset.tab){ TAB=b.dataset.tab; OPEN=null; render(); window.scrollTo(0,0); try{localStorage.setItem(KEY+".tab",TAB);}catch(e){} return; }
  if(b.dataset.gf){ GF=b.dataset.gf; render(); return; }
  if(b.dataset.open){ OPEN=b.dataset.open; GF=BYC[OPEN].g; render(); return; }
  if(b.dataset.tpldel){ DB.tpl=(DB.tpl||[]).filter(t=>t.id!==b.dataset.tpldel); save(); render(); toast("削除しました"); return; }
  const a=b.dataset.act;
  if(a==="tplAddP"){ const t=$("#tplNewP").value.trim(); if(!t){ toast("登録する文を入れてください"); return; } DB.tpl=DB.tpl||[]; DB.tpl.push({id:"u"+Date.now(), code:$("#tplCodeP").value, text:t}); save(); render(); toast("定型文を登録しました"); return; }
  if(a==="tplReset"){ confirmBox("定型文を最初の状態に戻します。自分で登録した定型文は消えます。", ()=>{ DB.tpl=null; ensureTpl(); save(); render(); toast("最初の定型文に戻しました"); }, "戻す"); return; }
  if(a==="copymemo"){ copy($("#memoOut").textContent, null); return; }
  if(a==="newcase"){
    const id=$("#newId").value.trim(); const dt=$("#newDate").value;
    if(!id){ toast("番号を入れてください"); return; }
    if(/[一-龥ぁ-んァ-ン]{2,}(さん|様)?$/.test(id) && !/[0-9]/.test(id)){ toast("氏名ではなく番号で管理してください"); return; }
    if(DB.cases.some(c=>c.id===id)){ toast("同じ番号の調査があります"); return; }
    DB.cases.push({id,date:dt,r:{},pre:{}}); DB.cur=id; save(); TAB="items"; GF="1"; render(); toast(`${id} を作成しました`); return;
  }
  if(a==="delcase"){ const c=cur(); confirmBox(`調査「${c.id}」を削除します。元に戻せません。`, ()=>{ DB.cases=DB.cases.filter(x=>x.id!==c.id); DB.cur=DB.cases[0]?DB.cases[0].id:null; save(); render(); toast("削除しました"); }); return; }
  if(a==="copysum"){ copy($("#sumOut").textContent, null); return; }
  if(a==="copyjson"){ const t=JSON.stringify(DB); $("#jsonBox").value=t; copy(t, $("#jsonBox")); return; }
  if(a==="importjson"){ importText($("#jsonBox").value); return; }
});
document.addEventListener("change", e=>{
  const x=e.target; if(x.closest(".sheet")) return;
  if(x.id==="caseSel"){ DB.cur=x.value; save(); OPEN=null; render(); return; }
  if(x.dataset.pre){ const c=cur(); c.pre=c.pre||{}; c.pre[x.dataset.pre]=x.checked; save(); return; }
  if(x.dataset.end){ const c=cur(); c[x.dataset.end]=x.checked; save(); return; }
  if(x.id==="curDate"){ const c=cur(); c.date=x.value; save(); renderHeader(); return; }
  if(x.id==="jsonFile" && x.files[0]){ const fr=new FileReader(); fr.onload=()=>importText(fr.result); fr.readAsText(x.files[0]); }
});
document.addEventListener("input", e=>{
  const x=e.target; if(x.closest(".sheet")) return;
  if(x.dataset.gk){ const c=cur(); if(!c) return; c.gk=c.gk||{}; c.gk[x.dataset.gk]=x.value; save(); }
});
function importText(t){
  try{ const d=JSON.parse(t); if(!d||!Array.isArray(d.cases)) throw 0;
    d.cases.forEach(c=>{ const i=DB.cases.findIndex(x=>x.id===c.id); if(i>=0) DB.cases[i]=c; else DB.cases.push(c); });
    if(Array.isArray(d.tpl)){ ensureTpl(); d.tpl.forEach(t=>{ if(!DB.tpl.some(x=>x.id===t.id||x.text===t.text)) DB.tpl.push(t); }); }
    DB.cur=d.cur||DB.cur||(DB.cases[0]&&DB.cases[0].id); save(); render(); toast(`${d.cases.length}件を読み込みました`);
  }catch(e){ toast("読み込めませんでした。バックアップの文字をそのまま貼り付けてください"); }
}

/* ===== 起動 ===== */
load();
ensureTpl();
if(!DB.cases.length){ DB.cases=[sampleCase()]; DB.cur="例-001"; }
if(!DB.cur && DB.cases[0]) DB.cur=DB.cases[0].id;
try{ const t=localStorage.getItem(KEY+".tab"); if(t) TAB=t; }catch(e){}
render();
</script>
